version: '3.8'

services:
  # 1. Контейнер с базой данных PostgreSQL
  postgres-db:
    image: postgres:15-alpine # Используем зеркало для стабильного скачивания
    container_name: slots-postgres
    environment:
      POSTGRES_DB: slots_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Динамический пароль из .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - slots-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slots_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Контейнер с Java Spring Boot slots-api
  slots-api-app:
    build: .
    container_name: slots-api-service
    ports:
      - "8080:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres-db:5432/slots_db
      JDBC_DATABASE_USERNAME: postgres
      JDBC_DATABASE_PASSWORD: ${DB_PASSWORD} # Динамический пароль из .env
      APP_SECURITY_MARKETPLACE_SECRET: ${MARKETPLACE_SIGNING_SECRET} # Секрет подписи из .env
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE} # Профиль из .env (dev/prod)
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - slots-network

networks:
  slots-network:
    driver: bridge

volumes:
  pgdata: